name: Build release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v0.7.0

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check module
        run: |
          npm run check
          npm test

      - name: Verify tag matches module version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          MODULE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('module.json', 'utf8')).version")"
          test "v${MODULE_VERSION}" = "$RELEASE_TAG"

      - name: Build installable archive
        run: |
          mkdir "$RUNNER_TEMP/package"
          git archive --format=tar HEAD \
            module.json scripts styles templates lang README.md CHANGELOG.md LICENSE docs/API.md \
            | tar -xf - -C "$RUNNER_TEMP/package"
          node -e "const fs = require('fs'); const path = process.env.RUNNER_TEMP + '/package/module.json'; const data = JSON.parse(fs.readFileSync(path, 'utf8')); data.manifest = 'https://github.com/RaiNaifa/rn-portrait-stage/releases/latest/download/module.json'; fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');"
          cp "$RUNNER_TEMP/package/module.json" module.json
          (cd "$RUNNER_TEMP/package" && zip -qr "$GITHUB_WORKSPACE/rn-portrait-stage.zip" \
            module.json scripts styles templates lang README.md CHANGELOG.md LICENSE docs/API.md)
          unzip -t rn-portrait-stage.zip

      - name: Attach manifest and archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" module.json rn-portrait-stage.zip
